name: PR80 live Batch 4 release verification
on:
  push:
    branches: [p2-project-seo-batch4-live-verification]
permissions:
  contents: read
jobs:
  live-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify PR80 live release without sending leads
        run: node research/scripts/check-live-project-seo-batch4-release.mjs
      - name: Re-run live Olara release audit
        run: node research/scripts/check-live-olara-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr80-live-release-${{ github.sha }}
          path: |
            .runtime/live-batch4-release/
            .runtime/live-olara-release/
          retention-days: 14
