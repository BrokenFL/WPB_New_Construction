name: Batch 6 concierge implementation review (no deploy)
on:
  push:
    branches: [p2-batch6-concierge-intents]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  candidate:
    name: Batch 6 concierge (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [keyed, no-key]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require production ancestry and exclude deferred tracks
        run: |
          git merge-base --is-ancestor 0713e029cc251fc9a49c5e429fdda6ac85e46202 HEAD
          ! git diff --name-only 0713e029cc251fc9a49c5e429fdda6ac85e46202 HEAD | grep -Ei '(^|/)(three|3d|cesium|blender)|\.glb$|\.blend$|alba.*(html|publish)'
      - name: Require restricted review Maps key
        if: matrix.mode == 'keyed'
        env:
          HAS_REVIEW_KEY: ${{ secrets.P2_REVIEW_GOOGLE_MAPS_API_KEY != '' }}
          RESTRICTIONS_CONFIRMED: ${{ vars.P2_REVIEW_MAPS_KEY_RESTRICTIONS_CONFIRMED == 'true' }}
        run: |
          test "$HAS_REVIEW_KEY" = true
          test "$RESTRICTIONS_CONFIRMED" = true
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - name: Build candidate
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ matrix.mode == 'keyed' && secrets.P2_REVIEW_GOOGLE_MAPS_API_KEY || '' }}
          VITE_GA4_MEASUREMENT_ID: G-0LGBH6MDVX
        run: npm run build
      - name: Five-intent server/browser contract
        run: node --test research/scripts/request-intents.test.mjs
      - name: Concierge desktop/mobile and lightweight boundary
        run: node research/scripts/check-batch6-concierge.mjs
      - name: Full repository suite
        env:
          WPB_MAP_QA_MODE: ${{ matrix.mode }}
          WPB_MAP_QA_PORT: '4173'
        run: npm test
      - name: Retain authorship H1 schema and buyer journey regressions
        env:
          FLOORPLAN_EXPECT_GA4: '1'
        run: |
          node --test research/scripts/authorship-trust.test.mjs
          node research/scripts/check-authorship-trust.mjs
          npm run qa:floorplan-entities -- --browser
          npm run qa:commercial -- --browser
          npm run qa:integration
          node --experimental-strip-types research/scripts/check-corridor-growth.mjs
          node --experimental-strip-types research/scripts/check-comparisons.mjs
          npm run qa:project-seo-batch4
          npm run assets:audit
          npm run assets:audit:strict
          npm run qa:seo
          npm run qa:geo
          npm run qa:agent-skills
          npm run qa:a11y-forms
          npm run qa:gatekeeper
      - name: Keyed preflight and actual Maps
        if: matrix.mode == 'keyed'
        run: |
          npm run qa:deploy-preflight
          npm run qa:maps-keyed
      - name: No-key deployment rejection
        if: matrix.mode == 'no-key'
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { verifyProductionMapBundle } from './research/scripts/production-map-preflight.mjs';
          await assert.rejects(verifyProductionMapBundle(), /reachable app chunks do not include/);
          JS
      - name: Scan evidence before upload
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('.runtime/batch6-concierge')
          for p in root.rglob('*') if root.exists() else []:
            if p.is_file() and re.search(rb'AIza[0-9A-Za-z_-]{30,}|gh[pousr]_[0-9A-Za-z]{30,}|github_pat_[0-9A-Za-z_]{30,}',p.read_bytes()):
              raise RuntimeError('Unsafe evidence withheld')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch6-concierge-${{ matrix.mode }}-${{ github.sha }}
          path: .runtime/batch6-concierge/
          retention-days: 14
  gate:
    name: Batch 6 concierge aggregate gate
    needs: candidate
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: test '${{ needs.candidate.result }}' = success
