name: P2 Batch 5 complete authorship verification (no deploy)
on:
  push:
    branches: [p2-real-person-authorship-trust-layer]
  pull_request:
    branches: [main]
    paths:
      - 'src/authorshipTrust.ts'
      - 'src/authorshipTrust.css'
      - 'public/data/contributors.json'
      - 'public/data/site-meta.json'
      - 'public/.well-known/agent-skills/**'
      - 'research/scripts/apply-authorship-trust.mjs'
      - 'research/scripts/authorship-trust.test.mjs'
      - 'research/scripts/check-authorship-trust.mjs'
      - 'package.json'
      - '.github/workflows/p2-authorship-trust-complete-review.yml'
      - 'docs/P2_AUTHORSHIP_TRUST_PROGRESS.md'
      - 'docs/PHASE_2_DELIVERY_TRACKER.md'
permissions:
  contents: read
concurrency:
  group: p2-authorship-trust-complete-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    name: Batch 5 candidate (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        mode: [no-key, keyed]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify production ancestry and protected surfaces
        run: |
          git merge-base --is-ancestor b85e27d967f7bc3704102ea2de5f4babaa274dae HEAD
          git diff --exit-code b85e27d967f7bc3704102ea2de5f4babaa274dae HEAD -- \
            src/lib/analytics.ts src/lib/analyticsSafety.ts src/lib/leadCapture.ts src/lib/inquiryContext.ts \
            src/floorplanPage.ts src/floorplanEntities.css src/lib/floorplanEntities.ts src/data/floorplanApprovedLibrary.ts src/data/olaraPlanExpansion.ts \
            src/comparisonPage.ts src/lib/shortlist.ts src/corridorGrowth.ts src/commercialGrowth.ts \
            functions package-lock.json .github/workflows/deploy-cloudflare-pages.yml
          ! git diff --name-only b85e27d967f7bc3704102ea2de5f4babaa274dae HEAD | grep -Ei '(^|/)(three|3d|cesium|blender)|\.glb$|\.blend$'
          ! git diff --name-only b85e27d967f7bc3704102ea2de5f4babaa274dae HEAD | grep -Ei 'alba.*(html|publish)|floorplan.*three|three.*floorplan'
          mkdir -p .runtime/p2-authorship-trust
          git rev-parse HEAD > .runtime/p2-authorship-trust/tested-sha.txt
      - name: Require reviewed Maps key
        if: matrix.mode == 'keyed'
        env:
          HAS_REVIEW_KEY: ${{ secrets.P2_REVIEW_GOOGLE_MAPS_API_KEY != '' }}
          RESTRICTIONS_CONFIRMED: ${{ vars.P2_REVIEW_MAPS_KEY_RESTRICTIONS_CONFIRMED == 'true' }}
        run: |
          test "$HAS_REVIEW_KEY" = true
          test "$RESTRICTIONS_CONFIRMED" = true
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - name: Build reviewed candidate
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ matrix.mode == 'keyed' && secrets.P2_REVIEW_GOOGLE_MAPS_API_KEY || '' }}
          VITE_GA4_MEASUREMENT_ID: G-0LGBH6MDVX
        run: npm run build
      - name: Batch 5 source contracts
        run: node --test research/scripts/authorship-trust.test.mjs
      - name: Batch 5 browser and no-JavaScript audit
        run: node research/scripts/check-authorship-trust.mjs
      - name: Full repository suite
        env:
          WPB_MAP_QA_MODE: ${{ matrix.mode }}
          WPB_MAP_QA_PORT: '4173'
        run: npm test
      - name: Assets SEO agent-skill and gatekeeper checks
        run: |
          npm run assets:audit
          npm run assets:audit:strict
          npm run qa:seo
          npm run qa:agent-skill
          npm run qa:gatekeeper
      - name: Existing buyer journeys
        env:
          FLOORPLAN_EXPECT_GA4: '1'
        run: |
          npm run qa:floorplan-entities -- --browser
          npm run qa:commercial -- --browser
          npm run qa:integration
          node --experimental-strip-types research/scripts/check-corridor-growth.mjs
          node --experimental-strip-types research/scripts/check-comparisons.mjs
          npm run qa:project-seo-batch4
      - name: Keyed deployment preflight and actual Google Maps
        if: matrix.mode == 'keyed' && !cancelled()
        run: |
          npm run qa:deploy-preflight
          npm run qa:maps-keyed
      - name: No-key build must reject production deployment
        if: matrix.mode == 'no-key' && !cancelled()
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { verifyProductionMapBundle } from './research/scripts/production-map-preflight.mjs';
          await assert.rejects(verifyProductionMapBundle(), /reachable app chunks do not include/);
          console.log('PASS: missing-key production rejection remains enforced');
          JS
      - name: Scan safe evidence
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import pathlib,re
          roots=[pathlib.Path(p) for p in ['.runtime/p2-authorship-trust','.runtime/authorship-trust','.runtime/phase-2-qa','.runtime/p2-commercial','.runtime/p2-integration','.runtime/p2-corridors','.runtime/p2-comparisons','.runtime/p2-keyed-maps']]
          files=[p for root in roots for p in root.rglob('*') if p.is_file()]
          if any(re.search(rb'AIza[0-9A-Za-z_-]{30,}|gh[pousr]_[0-9A-Za-z]{30,}|github_pat_[0-9A-Za-z_]{30,}',p.read_bytes()) for p in files):
            raise RuntimeError('Unsafe evidence found; artifact withheld')
          print('PASS: evidence scan')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-authorship-trust-${{ matrix.mode }}-${{ github.sha }}
          path: |
            .runtime/p2-authorship-trust/
            .runtime/authorship-trust/
            .runtime/phase-2-qa/
            .runtime/p2-commercial/
            .runtime/p2-integration/
            .runtime/p2-corridors/
            .runtime/p2-comparisons/
            .runtime/p2-keyed-maps/
          retention-days: 14

  review-gate:
    name: Batch 5 review verification
    if: always()
    needs: [candidate]
    runs-on: ubuntu-latest
    steps:
      - env:
          CANDIDATE: ${{ needs.candidate.result }}
        run: test "$CANDIDATE" = success
