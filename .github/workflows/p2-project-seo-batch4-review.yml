name: P2 project SEO Batch 4 review (no deploy)
on:
  push:
    branches: [p2-project-seo-rosewood-maison-dor]
permissions:
  contents: read
concurrency:
  group: p2-project-seo-batch4-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    name: Batch 4 candidate (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [no-key, keyed]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify production ancestry and protected surfaces
        run: |
          git merge-base --is-ancestor 589d2f43151d7e57af6c7a831fe4837b66cb5d3a HEAD
          git diff --exit-code 589d2f43151d7e57af6c7a831fe4837b66cb5d3a HEAD -- src/lib/analytics.ts src/lib/analyticsSafety.ts src/lib/leadCapture.ts src/lib/inquiryContext.ts src/floorplanPage.ts src/floorplanEntities.css src/lib/floorplanEntities.ts src/data/floorplanApprovedLibrary.ts src/data/olaraPlanExpansion.ts src/comparisonPage.ts src/lib/shortlist.ts src/corridorGrowth.ts src/commercialGrowth.ts functions package-lock.json .github/workflows/deploy-cloudflare-pages.yml
          ! git diff --name-only 589d2f43151d7e57af6c7a831fe4837b66cb5d3a HEAD | grep -Ei '(^|/)(three|3d|cesium|blender)|\.glb$|\.blend$'
          mkdir -p .runtime/p2-project-seo-batch4
          git rev-parse HEAD > .runtime/p2-project-seo-batch4/tested-sha.txt
      - name: Require reviewed Maps key
        if: matrix.mode == 'keyed'
        env:
          HAS_REVIEW_KEY: ${{ secrets.P2_REVIEW_GOOGLE_MAPS_API_KEY != '' }}
          RESTRICTIONS_CONFIRMED: ${{ vars.P2_REVIEW_MAPS_KEY_RESTRICTIONS_CONFIRMED == 'true' }}
        run: |
          test "$HAS_REVIEW_KEY" = true
          test "$RESTRICTIONS_CONFIRMED" = true
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - name: Build reviewed candidate
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ matrix.mode == 'keyed' && secrets.P2_REVIEW_GOOGLE_MAPS_API_KEY || '' }}
          VITE_GA4_MEASUREMENT_ID: G-0LGBH6MDVX
        run: npm run build
      - name: Full repository suite
        env:
          WPB_MAP_QA_MODE: ${{ matrix.mode }}
          WPB_MAP_QA_PORT: '4173'
        run: npm test
      - name: Batch 4 source and browser contracts
        run: |
          npm run test:project-seo-batch4
          npm run qa:project-seo-batch4
      - name: Assets SEO and gatekeeper
        run: |
          npm run assets:audit
          npm run assets:audit:strict
          npm run qa:seo
          npm run qa:gatekeeper
      - name: Existing buyer journeys
        env:
          FLOORPLAN_EXPECT_GA4: '1'
        run: |
          npm run qa:floorplan-entities -- --browser
          npm run qa:commercial -- --browser
          npm run qa:integration
          node --experimental-strip-types research/scripts/check-corridor-growth.mjs
          node --experimental-strip-types research/scripts/check-comparisons.mjs
      - name: Keyed deployment preflight and actual Google Maps
        if: matrix.mode == 'keyed' && !cancelled()
        run: |
          npm run qa:deploy-preflight
          npm run qa:maps-keyed
      - name: No-key build must reject production deployment
        if: matrix.mode == 'no-key' && !cancelled()
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { verifyProductionMapBundle } from './research/scripts/production-map-preflight.mjs';
          await assert.rejects(verifyProductionMapBundle(), /reachable app chunks do not include/);
          console.log('PASS: missing-key production rejection remains enforced');
          JS
      - name: Scan safe evidence
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import pathlib,re
          roots=[pathlib.Path(p) for p in ['.runtime/p2-project-seo-batch4','.runtime/phase-2-project-seo','.runtime/phase-2-qa','.runtime/p2-commercial','.runtime/p2-integration','.runtime/p2-corridors','.runtime/p2-comparisons','.runtime/p2-keyed-maps']]
          files=[p for root in roots for p in root.rglob('*') if p.is_file()]
          if any(re.search(rb'AIza[0-9A-Za-z_-]{30,}|gh[pousr]_[0-9A-Za-z]{30,}|github_pat_[0-9A-Za-z_]{30,}',p.read_bytes()) for p in files):
            raise RuntimeError('Unsafe evidence found; artifact withheld')
          print('PASS: evidence scan')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-project-seo-batch4-${{ matrix.mode }}-${{ github.sha }}
          path: |
            .runtime/p2-project-seo-batch4/
            .runtime/phase-2-project-seo/
            .runtime/phase-2-qa/
            .runtime/p2-commercial/
            .runtime/p2-integration/
            .runtime/p2-corridors/
            .runtime/p2-comparisons/
            .runtime/p2-keyed-maps/
          retention-days: 14

  live-olara:
    name: PR79 live Olara release verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify six deployed Olara pages without sending leads
        run: node research/scripts/check-live-olara-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr79-live-olara-${{ github.sha }}
          path: .runtime/live-olara-release/
          retention-days: 14

  review-gate:
    name: Batch 4 review verification
    if: always()
    needs: [candidate, live-olara]
    runs-on: ubuntu-latest
    steps:
      - env:
          CANDIDATE: ${{ needs.candidate.result }}
          LIVE_OLARA: ${{ needs.live-olara.result }}
        run: |
          test "$CANDIDATE" = success
          test "$LIVE_OLARA" = success
