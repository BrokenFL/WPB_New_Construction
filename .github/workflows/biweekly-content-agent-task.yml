name: Biweekly Content Agent Task

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

jobs:
  create-content-agent-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Check biweekly cadence
        id: cadence
        run: |
          week="$(date -u +%V)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ $((10#$week % 2)) -eq 0 ]; then
            echo "run_task=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_task=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create biweekly content task
        if: ${{ steps.cadence.outputs.run_task == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const title = `Biweekly WPB development blog agent run - ${today}`;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'content-agent'
            });
            if (existing.some((issue) => issue.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['content-agent'],
              body: [
                'Run the biweekly development blog workflow.',
                '',
                'Brief: `research/source-material-review/biweekly-development-blog-agent-brief.md`',
                '',
                'Deliverable:',
                '- One buyer-facing `/updates/` story, 400 words max.',
                '- No outbound project sponsor, project sales, or sales office links on the public site.',
                '- Source URLs stay in internal research metadata only.',
                '- Run `npm run news:refresh`, `npm run build`, `npm run qa:launch`, and `npm run qa:gatekeeper` before publishing.'
              ].join('\n')
            });
