name: P2-001 guard reproduction (no deploy)
on:
  push:
    branches: [astra-phase-2-growth]
    paths: [.github/workflows/p2-review-diagnostics.yml]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 44c79d24dfc124dc6c4571adf68318bf85d9b429
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the reviewed baseline with synthetic Maps configuration
        env:
          VITE_GOOGLE_MAPS_API_KEY: P2_SYNTHETIC_NOT_A_REAL_KEY
          VITE_GA4_MEASUREMENT_ID: G-P2TEST0001
        run: npm run build -- --manifest
      - name: Reproduce entry-only guard without invoking deployment
        run: |
          mkdir -p .runtime/p2-review
          node --input-type=module <<'NODE' | tee .runtime/p2-review/guard-reproduction.json
          import fs from 'node:fs/promises';
          const html = await fs.readFile('dist/index.html', 'utf8');
          const entry = html.match(/\/assets\/index-[^"]+\.js/)?.[0];
          const manifest = JSON.parse(await fs.readFile('dist/.vite/manifest.json', 'utf8'));
          const visited = new Set();
          const chunks = [];
          async function walk(key) {
            if (visited.has(key)) return;
            visited.add(key);
            const chunk = manifest[key];
            if (!chunk) throw new Error('Unresolved manifest dependency');
            const text = await fs.readFile('dist/' + chunk.file, 'utf8');
            chunks.push({ file: chunk.file, hasLoader: text.includes('maps.googleapis.com/maps/api/js') });
            for (const dep of [...(chunk.imports ?? []), ...(chunk.dynamicImports ?? [])]) await walk(dep);
          }
          const root = Object.keys(manifest).find((key) => manifest[key].isEntry && '/' + manifest[key].file === entry);
          if (!root) throw new Error('Missing actual entry');
          await walk(root);
          const oldGuardPass = (await fs.readFile('dist' + entry, 'utf8')).includes('maps.googleapis.com/maps/api/js');
          console.log(JSON.stringify({ testedSha: '44c79d24dfc124dc6c4571adf68318bf85d9b429', syntheticConfiguration: true, realMapsVerified: false, oldGuardPass, reachableLoaderChunks: chunks.filter((c) => c.hasLoader), reachableChunkCount: chunks.length }, null, 2));
          if (oldGuardPass || !chunks.some((c) => c.hasLoader)) process.exit(1);
          NODE
      - name: Assemble offline review workspace (no credentials or production upload)
        run: |
          python3 <<'PY'
          import pathlib, subprocess, tarfile
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          text = {'.ts', '.mjs', '.js', '.json', '.md', '.css', '.html', '.yml', '.yaml', '.xml', '.txt'}
          pilot = {'public/assets/projects/olara/floorplans/olara-floorplans-olara-floorplan-s-digital-31126-d-v01.pdf', 'public/assets/projects/olara/floorplans/previews/olara-floorplans-olara-floorplan-s-digital-31126-d-v01.jpg', 'public/assets/projects/alba-palm-beach/floorplans/alba-floorplans-residence-d-v01.pdf', 'public/assets/projects/alba-palm-beach/floorplans/previews/alba-floorplans-residence-d-v01.jpg', 'public/projects/olara/docs/floorplans/olara-residence-plan-d.pdf'}
          with tarfile.open('.runtime/p2-review/review-source.tar.gz', 'w:gz') as out:
            for name in paths:
              p = pathlib.Path(name)
              if p.is_file() and (name in pilot or (p.suffix in text and p.stat().st_size < 3000000) or name in {'public/_headers', 'public/_redirects'}):
                out.add(p, arcname=name)
          PY
          tar -czf .runtime/p2-review/review-node-modules.tar.gz node_modules
          cp dist/.vite/manifest.json .runtime/p2-review/reproduced-manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-001-offline-review-${{ github.run_id }}
          path: .runtime/p2-review/
          retention-days: 3
