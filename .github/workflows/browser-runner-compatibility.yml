name: Browser runner compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/browser-runner-compatibility.yml'
      - '.github/workflows/intel-fast-cycle.yml'
      - '.github/workflows/deploy-cloudflare-pages.yml'
      - 'tools/github-workflows/intel-fast-cycle.yml'
      - 'research/scripts/p2/fast-mode.test.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: browser-runner-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  chromium:
    name: Chromium on Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fixture tests only: never invoke the live cycle, Sheet or publisher.
      - name: Verify workflow contracts and Fast Cycle fixtures
        run: npm run test:p2:fast
      - name: Install locked Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Launch Chromium without external services
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          try {
            const page = await browser.newPage();
            await page.setContent('<title>Browser runner compatibility</title><p>Chromium ready</p>');
            assert.equal(await page.title(), 'Browser runner compatibility');
            assert.equal(await page.locator('p').innerText(), 'Chromium ready');
            console.log(`Chromium ${browser.version()} launched successfully`);
          } finally {
            await browser.close();
          }
          NODE
      - name: Record tested revision and verify sources stayed unchanged
        run: |
          git rev-parse HEAD
          git diff --exit-code
