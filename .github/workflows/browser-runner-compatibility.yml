name: Browser runner compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/browser-runner-compatibility.yml'
      - '.github/workflows/intel-fast-cycle.yml'
      - '.github/workflows/deploy-cloudflare-pages.yml'
      - 'tools/github-workflows/intel-fast-cycle.yml'
      - 'research/scripts/p2/fast-mode.test.mjs'
      - 'research/scripts/check-ci-browser.mjs'
      - 'research/scripts/p2/dispatch-fast-cycle-deploy*'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: browser-runner-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  chromium:
    name: Bundled Chromium on Ubuntu 24.04
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
      options: --user 1001
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fixture tests only: never invoke the live cycle, Sheet or publisher.
      - name: Verify workflow contracts and Fast Cycle fixtures
        run: npm run test:p2:fast
      - name: Verify locked bundled browser, fonts and tool compatibility
        run: node research/scripts/check-ci-browser.mjs
      - name: Record tested revision and verify sources stayed unchanged
        run: |
          git rev-parse HEAD
          git diff --exit-code
