name: Integration pinned sources (no deploy)
on:
  push:
    branches: [astra-p2-integrated-release]
    paths: [.github/workflows/p2-integration-source.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Archive exact text implementation inputs, never credentials or builds
        run: |
          mkdir -p .runtime/integration-source
          for sha in 183320c452e95565c2928bb5d0d9d9f0620eebfb 95cdd3fda76b595b6449331a7a94c6bf3aa89dfa; do
            git fetch --depth=1 origin "$sha"
            SHA="$sha" python3 - <<'PY'
          import os, re, subprocess, tarfile, io
          sha = os.environ['SHA']
          paths = subprocess.check_output(['git','ls-tree','-r','--name-only',sha]).decode().splitlines()
          paths = [p for p in paths if re.search(r'\.(ts|css|html|mjs|cjs|js|json|yml|yaml|md|toml|csv|txt)$', p) and not p.startswith(('public/', 'research/raw/', 'research/archive/'))]
          with tarfile.open('.runtime/integration-source/'+sha+'.tar.gz','w:gz') as tar:
            for p in paths:
              data = subprocess.check_output(['git','show',sha+':'+p])
              if len(data) > 4_000_000: continue
              item = tarfile.TarInfo(p); item.size=len(data); item.mode=0o644
              tar.addfile(item,io.BytesIO(data))
          PY
          done
      - uses: actions/upload-artifact@v4
        with:
          name: integration-pinned-text-sources
          path: .runtime/integration-source/
          retention-days: 3
