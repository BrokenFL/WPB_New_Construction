name: Revenue SEO Batch 2 review (no deploy)
on:
  push:
    branches: [codex/revenue-seo-batch2-review-2026-09-23]
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: revenue-seo-batch2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      QA_NO_WRITE: '1'
      WPB_MAP_QA_MODE: no-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Guard stacked review branch
        run: |
          test "$GITHUB_REPOSITORY" = BrokenFL/WPB_New_Construction
          test "$GITHUB_REF" = refs/heads/codex/revenue-seo-batch2-review-2026-09-23
          git merge-base --is-ancestor 1a5c9f90125580037e5b44c6e90ec8f53aeccd63 HEAD
          test -z "$(git status --porcelain)"
          mkdir -p .runtime/revenue-seo-batch2
          git rev-parse HEAD > .runtime/revenue-seo-batch2/input-sha.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Baseline and one-time source migration
        run: |
          node --experimental-strip-types research/scripts/revenue-seo-batch2-triage.mjs before
          python3 research/scripts/apply-revenue-seo-batch2.py
          python3 research/scripts/finalize-revenue-seo-batch2.py
      - name: Generate from existing sources only
        run: |
          node research/scripts/generate-project-model.mjs
          node research/scripts/parse-building-database.mjs
          node --experimental-strip-types research/scripts/generate-project-schema-safe.ts
          node research/scripts/build-site-intelligence.mjs --buyer-content-only
          git diff --check
          git diff --binary > .runtime/revenue-seo-batch2/first-generation.patch
          node research/scripts/generate-project-model.mjs
          node research/scripts/parse-building-database.mjs
          node --experimental-strip-types research/scripts/generate-project-schema-safe.ts
          node research/scripts/build-site-intelligence.mjs --buyer-content-only
          git diff --binary > .runtime/revenue-seo-batch2/second-generation.patch
          cmp .runtime/revenue-seo-batch2/first-generation.patch .runtime/revenue-seo-batch2/second-generation.patch
      - name: Typecheck
        run: npm run typecheck 2>&1 | tee .runtime/revenue-seo-batch2/typecheck.log
      - name: Build and postbuild
        id: build
        run: npm run build 2>&1 | tee .runtime/revenue-seo-batch2/build.log
      - name: Full suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm test 2>&1 | tee .runtime/revenue-seo-batch2/tests.log
      - name: Focused Batch 2 source and discovery tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node --experimental-strip-types --test research/scripts/revenue-seo-batch2.test.mjs 2>&1 | tee .runtime/revenue-seo-batch2/focused-tests.log
      - name: Current data impact triage
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          npm run qa:project-intelligence 2>&1 | tee .runtime/revenue-seo-batch2/intelligence-audit.log
          node --experimental-strip-types research/scripts/revenue-seo-batch2-triage.mjs after
      - name: Batch 2 desktop tablet and mobile browsers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node research/scripts/check-revenue-seo-batch2-browser.mjs 2>&1 | tee .runtime/revenue-seo-batch2/browser.log
      - name: Preserve Batch 1 browser journeys
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          node research/scripts/check-revenue-seo-batch1-browser.mjs 2>&1 | tee .runtime/revenue-seo-batch2/batch1-browser.log
          cp .runtime/revenue-seo-review/browser-results.json .runtime/revenue-seo-batch2/batch1-browser-results.json
      - name: Strict asset audit without rewriting tracked evidence
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,shutil
          files=[pathlib.Path('docs/reports/asset-pipeline-audit-report.'+e) for e in ['json','md']]
          before={p:p.read_bytes() if p.exists() else None for p in files}
          try:
              result=subprocess.run(['npm','run','assets:audit:strict'])
              for p in files:
                  if p.exists():shutil.copy2(p,pathlib.Path('.runtime/revenue-seo-batch2')/p.name)
          finally:
              for p,data in before.items():
                  if data is None:p.unlink(missing_ok=True)
                  else:p.write_bytes(data)
          raise SystemExit(result.returncode)
          PY
      - name: Commit tested outputs to Batch 2 branch only
        env:
          REVIEW_TOKEN: ${{ github.token }}
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          source='''content/project-copy-package.json content/project-page-overlays.json content/wpb_new_construction_building_database_cleaned.csv research/source-material-review/wpb-projects-canonical-v3-planning-update.json src/data/projectCardData.ts src/main.ts research/scripts/revenue-seo-batch2.test.mjs src/lib/corridorGrowthContent.ts shared/revenue-buyer-research.mjs research/scripts/build-site-intelligence.mjs config/preserved-floorplan-document-urls.json config/revenue-seo-batch2-applied.json vite.config.ts'''.split()
          generated='''src/generated/projectModel.json src/generated/projectModel.ts src/generated/projectModelPublic.json src/generated/projectModelPublic.ts src/generated/buildingDatabase.ts src/generated/buildingDatabasePublic.ts src/generated/projectSchemaSafe.json src/generated/projectSchemaRuntime.ts src/generated/siteData.ts public/data/site-meta.json public/data/project-copy-package.json public/data/floorplans.json public/llms.txt'''.split()
          changed=set(filter(None,subprocess.check_output(['git','diff','--name-only','-z']).decode().split('\0')))
          untracked=set(filter(None,subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z']).decode().split('\0')))
          allowed=set(source+generated)
          unexpected=(changed|untracked)-allowed
          if unexpected:raise SystemExit(f'Unexpected changes: {sorted(unexpected)}')
          if changed|untracked:subprocess.check_call(['git','add','--',*sorted(changed|untracked)])
          PY
          git diff --cached --stat > .runtime/revenue-seo-batch2/verified-diff-stat.txt
          git write-tree > .runtime/revenue-seo-batch2/tested-tree.txt
          if ! git diff --cached --quiet; then
            test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
            git -c user.name='WPB SEO Review' -c user.email='128734086+BrokenFL@users.noreply.github.com' commit -m 'Implement verified revenue SEO Batch 2 and source consistency'
            auth=$(printf 'x-access-token:%s' "$REVIEW_TOKEN" | base64 -w0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:"$GITHUB_REF"
            unset auth
          fi
          git rev-parse HEAD > .runtime/revenue-seo-batch2/verified-commit.txt
          test "$(git rev-parse HEAD^{tree})" = "$(cat .runtime/revenue-seo-batch2/tested-tree.txt)"
          test -z "$(git status --porcelain)"
      - name: Capture evidence
        if: always()
        run: |
          git diff 1a5c9f90125580037e5b44c6e90ec8f53aeccd63 -- . ':!.github/workflows/revenue-seo-batch2-review.yml' > .runtime/revenue-seo-batch2/review.patch
          python3 - <<'PY'
          import pathlib,subprocess,tarfile,shutil
          suffixes={'.ts','.tsx','.js','.mjs','.cjs','.json','.csv','.md','.yml','.yaml','.html','.css','.txt','.toml','.xml','.svg','.lock','.py','.mts'}
          paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with tarfile.open('.runtime/revenue-seo-batch2/source.tar.gz','w:gz') as a:
              for value in paths:
                  p=pathlib.Path(value)
                  if value and p.is_file() and (p.suffix in suffixes or p.name in {'.gitignore','_headers','_redirects'}) and not p.name.startswith('.env'):
                      a.add(p,arcname=value,recursive=False)
          out=pathlib.Path('.runtime/revenue-seo-batch2/built-html');out.mkdir(exist_ok=True)
          for slug in ['shorecrest','south-flagler-house']:
              p=pathlib.Path('dist/projects')/slug/'index.html'
              if p.exists():shutil.copy2(p,out/(slug+'.html'))
          p=pathlib.Path('dist/corridors/south-flagler/index.html')
          if p.exists():shutil.copy2(p,out/'south-flagler.html')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revenue-seo-batch2-${{ github.sha }}
          path: .runtime/revenue-seo-batch2/
          include-hidden-files: true
          retention-days: 7
