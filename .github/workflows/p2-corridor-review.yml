name: Corridor growth review (no deploy)
on:
  push:
    branches: [p2-corridor-seo-downtown-south-flagler-palm-beach]
permissions:
  contents: read
concurrency:
  group: corridor-growth-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    name: Corridor candidate (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [no-key, keyed]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify production ancestry and protected surfaces
        run: |
          git merge-base --is-ancestor dd28320f689a3f377b6137671e702b6c58778b67 HEAD
          git diff --exit-code dd28320f689a3f377b6137671e702b6c58778b67 HEAD -- src/main.ts src/lib/analytics.ts src/lib/analyticsSafety.ts src/lib/leadCapture.ts src/lib/floorplanEntities.ts src/lib/commercialContent.ts src/commercialGrowth.ts src/commercialGrowth.css src/generated public functions package.json package-lock.json .github/workflows/deploy-cloudflare-pages.yml
          mkdir -p .runtime/corridor-review
          git rev-parse HEAD > .runtime/corridor-review/tested-sha.txt
      - name: Require the reviewed dedicated Maps key
        if: matrix.mode == 'keyed'
        env:
          HAS_REVIEW_KEY: ${{ secrets.P2_REVIEW_GOOGLE_MAPS_API_KEY != '' }}
          RESTRICTIONS_CONFIRMED: ${{ vars.P2_REVIEW_MAPS_KEY_RESTRICTIONS_CONFIRMED == 'true' }}
        run: |
          test "$HAS_REVIEW_KEY" = true
          test "$RESTRICTIONS_CONFIRMED" = true
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - name: Build candidate (review key is BUILD only)
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ matrix.mode == 'keyed' && secrets.P2_REVIEW_GOOGLE_MAPS_API_KEY || '' }}
          VITE_GA4_MEASUREMENT_ID: G-0LGBH6MDVX
        run: npm run build
      - name: Full repository tests, including corridor contracts, SEO and gatekeeper
        env:
          WPB_MAP_QA_MODE: ${{ matrix.mode }}
          WPB_MAP_QA_PORT: '4173'
        run: npm test
      - name: Standard and strict asset audit
        run: |
          npm run assets:audit
          npm run assets:audit:strict
          cp docs/reports/asset-pipeline-audit-report.json .runtime/corridor-review/asset-audit.json
      - name: Existing commercial, floor-plan and combined journey regressions
        env:
          FLOORPLAN_EXPECT_GA4: '1'
        run: |
          npm run qa:floorplan-entities -- --browser
          npm run qa:commercial -- --browser
          npm run qa:integration
      - name: Corridor desktop/mobile, native navigation and intercepted inquiry payloads
        if: ${{ !cancelled() }}
        run: node --experimental-strip-types research/scripts/check-corridor-growth.mjs
      - name: Keyed preflight and actual Google Maps
        if: matrix.mode == 'keyed' && !cancelled()
        run: |
          npm run qa:deploy-preflight
          npm run qa:maps-keyed
      - name: No-key build must reject deployment
        if: matrix.mode == 'no-key' && !cancelled()
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { verifyProductionMapBundle } from './research/scripts/production-map-preflight.mjs';
          await assert.rejects(verifyProductionMapBundle(), /reachable app chunks do not include/);
          console.log('PASS: missing-key deployment rejection is enforced');
          JS
      - name: Preserve reviewed source and safe evidence
        if: ${{ !cancelled() }}
        run: |
          git archive --format=tar HEAD src/lib/corridorGrowthContent.ts src/corridorGrowth.ts src/corridorGrowth.css src/bootstrap.ts src/lib/inquiryContext.ts research/scripts/prerender-commercial-routes.mjs research/scripts/prerender-corridor-growth.mjs research/scripts/corridor-growth.test.mjs research/scripts/check-corridor-growth.mjs research/scripts/integration.test.mjs .github/workflows/p2-corridor-review.yml > .runtime/corridor-review/reviewed-source.tar
          python3 - <<'PY'
          import pathlib,re
          roots=[pathlib.Path(p) for p in ['.runtime/corridor-review','.runtime/p2-corridors','.runtime/p2-keyed-maps','.runtime/phase-2-qa','.runtime/p2-commercial','.runtime/p2-integration']]
          files=[p for root in roots for p in root.rglob('*') if p.is_file()]
          if any(re.search(rb'AIza[0-9A-Za-z_-]{30,}|gh[pousr]_[0-9A-Za-z]{30,}|github_pat_[0-9A-Za-z_]{30,}',p.read_bytes()) for p in files):
            for p in files:p.unlink()
            raise RuntimeError('Unsafe evidence withheld')
          print('PASS: source/screenshots/summaries scanned; no credential-bearing builds archived')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corridor-review-${{ matrix.mode }}-${{ github.sha }}
          path: |
            .runtime/corridor-review/
            .runtime/p2-corridors/
            .runtime/p2-keyed-maps/
            .runtime/phase-2-qa/
            .runtime/p2-commercial/
            .runtime/p2-integration/
          retention-days: 14
  review-gate:
    name: Corridor batch review verification
    if: always()
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.candidate.result }}
        run: test "$RESULT" = success
