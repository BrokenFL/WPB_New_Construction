name: Live News Agent Task

on:
  schedule:
    - cron: "30 13 * * 1,3,5"
  workflow_dispatch:

jobs:
  create-live-news-agent-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Create live news task
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const title = `Live WPB news agent review - ${today}`;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'live-news-agent'
            });
            if (existing.some((issue) => issue.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['live-news-agent'],
              body: [
                'Run the live market update workflow.',
                '',
                'Brief: `research/source-material-review/live-news-agent-brief.md`',
                '',
                'Source priorities:',
                '- Current local/reputable articles first: city records, The Real Deal, Florida YIMBY, South Florida Business Journal, Palm Beach Post, WFLX, World Red Eye.',
                '- Project announcements only when they change buyer decisions.',
                '',
                'Deliverable:',
                '- Refresh `/updates/` and the homepage Live Market Updates module if there is buyer-relevant news.',
                '- Keep public image labels as `Building Name | Corridor`.',
                '- Keep outbound source URLs in research metadata; do not route public cards to sponsor or sales-office pages.',
                '- Run `npm run news:refresh`, `npm run build`, `npm run qa:launch`, and `npm run qa:gatekeeper` before publishing.'
              ].join('\n')
            });
