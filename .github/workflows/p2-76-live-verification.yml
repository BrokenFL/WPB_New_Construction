name: PR76 live corridor click diagnosis (no deploy)
on:
  push:
    branches: [p2-76-live-verification]
    paths: [.github/workflows/p2-76-live-verification.yml]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Actual click trace (all mutations blocked)
        run: node research/scripts/corridor-click-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr76-live-click-trace
          path: .runtime/p2-76-probe/
          retention-days: 14
