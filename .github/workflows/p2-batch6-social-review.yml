name: Batch 6C social preview review (no deploy)
on:
  push:
    branches: [p2-batch6-social-previews]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  candidate:
    name: Batch 6C social previews (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [keyed, no-key]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require production ancestry and independent social scope
        run: |
          git merge-base --is-ancestor 0713e029cc251fc9a49c5e429fdda6ac85e46202 HEAD
          ALLOWED='^(index\.html|package\.json|src/bootstrap\.ts|src/lib/socialPreview\.ts|shared/public-social-url\.(js|d\.ts)|research/scripts/(normalize-social-previews|check-social-previews)\.mjs|\.github/workflows/p2-batch6-social-review\.yml)$'
          BAD=$(git diff --name-only 0713e029cc251fc9a49c5e429fdda6ac85e46202 HEAD | grep -Ev "$ALLOWED" || true)
          test -z "$BAD" || { echo "$BAD"; exit 1; }
          ! git diff --name-only 0713e029cc251fc9a49c5e429fdda6ac85e46202 HEAD | grep -Ei '(^|/)(three|3d|cesium|blender)|\.glb$|\.blend$|alba.*(html|publish)'
      - name: Require restricted review Maps key
        if: matrix.mode == 'keyed'
        env:
          HAS_REVIEW_KEY: ${{ secrets.P2_REVIEW_GOOGLE_MAPS_API_KEY != '' }}
          RESTRICTIONS_CONFIRMED: ${{ vars.P2_REVIEW_MAPS_KEY_RESTRICTIONS_CONFIRMED == 'true' }}
        run: |
          test "$HAS_REVIEW_KEY" = true
          test "$RESTRICTIONS_CONFIRMED" = true
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - name: Build reviewed candidate
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ matrix.mode == 'keyed' && secrets.P2_REVIEW_GOOGLE_MAPS_API_KEY || '' }}
          VITE_GA4_MEASUREMENT_ID: G-0LGBH6MDVX
        run: npm run build
      - name: Raw JS-off hydrated SPA and image verification
        run: node research/scripts/check-social-previews.mjs
      - name: Complete repository suite
        env:
          WPB_MAP_QA_MODE: ${{ matrix.mode }}
          WPB_MAP_QA_PORT: '4173'
        run: npm test
      - name: Retain authorship SEO assets and privacy contracts
        run: |
          node --test research/scripts/authorship-trust.test.mjs
          node research/scripts/check-authorship-trust.mjs
          npm run assets:audit
          npm run assets:audit:strict
          npm run qa:seo
          npm run qa:geo
          npm run qa:agent-skills
          npm run qa:internal-links
          npm run qa:gatekeeper
      - name: Keyed preflight and actual Maps
        if: matrix.mode == 'keyed'
        run: |
          npm run qa:deploy-preflight
          npm run qa:maps-keyed
      - name: No-key deployment rejection
        if: matrix.mode == 'no-key'
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { verifyProductionMapBundle } from './research/scripts/production-map-preflight.mjs';
          await assert.rejects(verifyProductionMapBundle(), /reachable app chunks do not include/);
          JS
      - name: Scan evidence before upload
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('.runtime/batch6-social-previews')
          for p in root.rglob('*') if root.exists() else []:
              if p.is_file() and re.search(rb'AIza[0-9A-Za-z_-]{30,}|gh[pousr]_[0-9A-Za-z]{30,}|github_pat_[0-9A-Za-z_]{30,}',p.read_bytes()):
                  raise RuntimeError('Unsafe evidence withheld')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch6-social-${{ matrix.mode }}-${{ github.sha }}
          path: .runtime/batch6-social-previews/
          retention-days: 14
  gate:
    name: Batch 6C aggregate gate
    needs: candidate
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: test '${{ needs.candidate.result }}' = success
