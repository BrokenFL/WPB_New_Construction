name: Intel Fast Cycle

# Fast Mode processing owner. Runs the full cycle every 15 minutes:
#   Incoming_Intel -> fact packets/decisions -> Story_Queue -> publish ->
#   canonical fact application -> regenerate -> commit/push -> normal deploy.
#
# The Sheet is the durable workflow state; a missed run self-heals because
# unprocessed rows keep their non-terminal status until the next cycle.
#
# One-time setup (repo secret):
#   P2_GOOGLE_SERVICE_ACCOUNT_JSON  service-account key JSON with Sheets
#                                 read/write on the intelligence spreadsheet
#
# Article/fact commits use the job-scoped github.token. Because pushes made by
# that token do not start another workflow, a successful content push is
# followed by an explicit deploy workflow_dispatch.

on:
  schedule:
    - cron: "*/15 * * * *"
  repository_dispatch:
    types: [wpb-intel-scan]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: intel-fast-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      P2_DRY_RUN: ${{ vars.P2_DRY_RUN || '1' }}
      P2_SKIP_PUBLISH: ${{ vars.P2_SKIP_PUBLISH || '1' }}
    steps:
      - name: Validate runtime configuration
        shell: bash
        env:
          P2_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.P2_GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=0
          if [[ -z "${P2_GOOGLE_SERVICE_ACCOUNT_JSON:-}" ]]; then
            echo "::error::Missing repository secret P2_GOOGLE_SERVICE_ACCOUNT_JSON"
            missing=1
          fi
          if [[ "${P2_DRY_RUN}" != "0" && "${P2_DRY_RUN}" != "1" ]]; then
            echo "::error::P2_DRY_RUN must be 0 or 1"
            missing=1
          fi
          if [[ "${P2_SKIP_PUBLISH}" != "0" && "${P2_SKIP_PUBLISH}" != "1" ]]; then
            echo "::error::P2_SKIP_PUBLISH must be 0 or 1"
            missing=1
          fi
          exit "${missing}"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "wpb-intel-bot"
          git config user.email "wpb-intel-bot@users.noreply.github.com"

      - name: Run fast cycle
        env:
          P2_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.P2_GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: npm run p2:fast:cycle

      - name: Dispatch deployment after a Fast Cycle content push
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ -z "${remote_head}" ]]; then
            echo "::error::Could not resolve remote main after Fast Cycle"
            exit 1
          fi
          if [[ "${remote_head}" == "${{ github.sha }}" ]]; then
            echo "Fast Cycle made no content push; no deployment dispatch needed."
            exit 0
          fi
          gh workflow run deploy-cloudflare-pages.yml --ref main
          echo "Dispatched Cloudflare deployment for ${remote_head}."
