    <circle cx="390" cy="500" r="74" fill="#7eb0a3"/>
    <circle cx="834" cy="674" r="82" fill="#d9b36a"/>
  </g>
  <g filter="url(#shadow)" font-family="Iowan Old Style, Georgia, serif">
