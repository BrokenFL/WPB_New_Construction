  <path d="M880 0 C850 148 846 288 870 420 C892 552 944 686 1014 820 L1200 820 L1200 0 Z" fill="#1d2728"/>
  <g stroke="#f4d49a" stroke-width="2" opacity="0.16">
    <path d="M90 120 H448"/>
    <path d="M78 212 H424"/>
    <path d="M68 304 H408"/>
    <path d="M70 396 H390"/>
    <path d="M78 488 H384"/>
