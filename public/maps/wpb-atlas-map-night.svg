<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Nocturne West Palm Beach development corridor map</title>
  <desc id="desc">A dark stylized static map with glowing waterfront corridors and project clusters.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="0.58" stop-color="#10252b"/>
      <stop offset="1" stop-color="#2d2520"/>
    </linearGradient>
    <linearGradient id="bay" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#173a42"/>
      <stop offset="0.5" stop-color="#2e7478"/>
      <stop offset="1" stop-color="#86b8a9"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1200" height="820" fill="url(#sky)"/>
  <path d="M528 0 C618 164 576 282 548 386 C512 520 545 662 618 820 L807 820 C735 652 700 526 728 396 C759 252 820 129 874 0 Z" fill="url(#bay)" opacity="0.92"/>
